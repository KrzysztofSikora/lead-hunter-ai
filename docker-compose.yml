services:
  app:
    build: .
    image: lead-hunter-ai:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8080'
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional (README: Ollama). Started only with `docker compose --profile ollama up -d`.
  # The app reaches it with LLM_PROVIDER=openai-compatible and LLM_BASE_URL=http://ollama:11434/v1.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.2
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama: {}
